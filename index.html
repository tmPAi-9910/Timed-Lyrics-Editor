<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timed Lyrics Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        header p {
            opacity: 0.9;
            font-size: 0.9em;
        }

        /* 波形表示エリア */
        .waveform-container {
            background: #1a1a2e;
            padding: 15px 30px;
            position: relative;
        }

        .waveform-canvas {
            width: 100%;
            height: 80px;
            background: #16213e;
            border-radius: 8px;
            cursor: pointer;
        }

        .waveform-time {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00cec9;
            font-family: 'Courier New', monospace;
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 206, 201, 0.5);
            pointer-events: none;
        }

        .waveform-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .waveform-controls button {
            padding: 8px 16px;
            font-size: 12px;
        }

        /* タブ切り替え */
        .tabs {
            display: flex;
            background: #f1f1f1;
            padding: 0;
            border-bottom: 2px solid #ddd;
        }

        .tab-button {
            flex: 1;
            padding: 15px 20px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            border-radius: 10px 10px 0 0;
            margin: 0 5px;
        }

        .tab-button:hover {
            background: #e9ecef;
            transform: none;
            box-shadow: none;
        }

        .tab-button.active {
            color: #667eea;
            background: white;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
            padding: 30px;
        }

        .tab-content.active {
            display: block;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .tabs {
                flex-wrap: wrap;
            }
            .tab-button {
                flex: 0 0 48%;
                margin: 5px 1%;
            }
        }

        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        textarea {
            width: 100%;
            height: 300px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #6c757d;
        }

        button.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }

        /* 旧 lyrics-display は削除済み - 新しい preview-container を使用 */

        .time-display {
            font-size: 2em;
            text-align: center;
            padding: 20px;
            background: #2d3436;
            color: #00cec9;
            font-family: 'Courier New', monospace;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .instructions {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .instructions h3 {
            color: #1976d2;
            margin-bottom: 10px;
        }

        .instructions ul {
            margin-left: 20px;
        }

        .instructions li {
            margin: 5px 0;
        }

        .file-input {
            display: none;
        }

        .export-format {
            margin-top: 15px;
        }

        .export-format label {
            margin-right: 15px;
            cursor: pointer;
        }

        /* 同期モード用 */
        .sync-mode-info {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .sync-mode-info h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .shortcut-list {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .shortcut-list h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .shortcut-item:last-child {
            border-bottom: none;
        }

        .shortcut-key {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
        }

        /* プレビュー UI - カラオケ風スタイル */
        .preview-container {
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-radius: 15px;
            padding: 30px;
            min-height: 450px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .preview-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }

        .preview-header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .preview-header h3 {
            color: #fff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 3px;
            opacity: 0.7;
            margin: 0;
        }

        .now-playing-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 10px;
        }

        .now-playing-dot {
            width: 8px;
            height: 8px;
            background: #00cec9;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .now-playing-text {
            color: #00cec9;
            font-size: 0.85em;
            font-weight: 600;
        }

        .lyrics-stage {
            position: relative;
            z-index: 1;
            min-height: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        .current-lyric-wrapper {
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .current-lyric {
            font-size: 2.2em;
            font-weight: 700;
            color: #fff;
            text-shadow: 
                0 0 20px rgba(102, 126, 234, 0.8),
                0 0 40px rgba(102, 126, 234, 0.5),
                0 2px 4px rgba(0, 0, 0, 0.3);
            line-height: 1.4;
            max-width: 90%;
            animation: lyricFadeIn 0.5s ease-out;
            letter-spacing: 1px;
        }

        @keyframes lyricFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
                filter: blur(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .next-lyric-wrapper {
            text-align: center;
            margin-top: 25px;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .next-lyric-label {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .next-lyric {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
            line-height: 1.4;
            max-width: 80%;
        }

        .progress-container {
            position: relative;
            z-index: 1;
            margin-top: 30px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2, #00cec9);
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }

        .progress-time {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.6);
        }

        .lyrics-list-preview {
            position: relative;
            z-index: 1;
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .lyrics-list-preview::-webkit-scrollbar {
            width: 6px;
        }

        .lyrics-list-preview::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 3px;
        }

        .lyrics-list-preview::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .mini-lyric-line {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mini-lyric-line:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .mini-lyric-line.active {
            background: rgba(102, 126, 234, 0.3);
            border-left: 3px solid #667eea;
        }

        .mini-timestamp {
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            color: #00cec9;
            min-width: 65px;
        }

        .mini-lyric-text {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.9);
        }

        .mini-lyric-line.active .mini-timestamp,
        .mini-lyric-line.active .mini-lyric-text {
            color: #fff;
        }

        .no-lyrics-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            padding: 60px 20px;
        }

        .no-lyrics-message .icon {
            font-size: 3em;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .preview-controls {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .preview-controls button {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .preview-controls button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .equalizer {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 3px;
            height: 30px;
            margin-bottom: 15px;
        }

        .equalizer-bar {
            width: 4px;
            background: linear-gradient(to top, #667eea, #00cec9);
            border-radius: 2px;
            animation: equalize 0.5s ease-in-out infinite alternate;
        }

        .equalizer-bar:nth-child(1) { height: 40%; animation-delay: 0s; }
        .equalizer-bar:nth-child(2) { height: 70%; animation-delay: 0.1s; }
        .equalizer-bar:nth-child(3) { height: 100%; animation-delay: 0.2s; }
        .equalizer-bar:nth-child(4) { height: 60%; animation-delay: 0.3s; }
        .equalizer-bar:nth-child(5) { height: 80%; animation-delay: 0.4s; }

        @keyframes equalize {
            from { transform: scaleY(0.3); }
            to { transform: scaleY(1); }
        }

        .audio-player {
            margin-top: 20px;
            width: 100%;
        }

        .help-content {
            line-height: 1.8;
        }

        .help-content h3 {
            color: #667eea;
            margin: 20px 0 10px;
        }

        .help-content p {
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Timed Lyrics Editor</h1>
            <p>歌詞にタイミングを付けてカラオケ風ファイルを作成</p>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <div class="panel">
                    <h2>📝 歌詞入力</h2>
                    <div class="instructions">
                        <h3>使い方</h3>
                        <ul>
                            <li>歌詞を1行ずつ入力してください</li>
                            <li>「現在の時間を追加」ボタンでタイムスタンプを挿入</li>
                            <li>スペースキーでもタイムスタンプを追加できます</li>
                            <li>LRC形式またはJSON形式でエクスポート可能</li>
                        </ul>
                    </div>
                    <textarea id="lyricsInput" placeholder="ここに歌詞を入力してください...&#10;例：&#10;初めての出会い&#10;あの日の午後&#10;忘れられない瞬間"></textarea>
                    
                    <div class="time-display" id="timeDisplay">00:00.00</div>
                    
                    <div class="controls">
                        <button onclick="addTimestamp()">⏱️ 現在の時間を追加</button>
                        <button onclick="startTimer()" class="success">▶️ スタート</button>
                        <button onclick="pauseTimer()" class="secondary">⏸️ ポーズ</button>
                        <button onclick="resetTimer()" class="secondary">🔄 リセット</button>
                    </div>

                    <div class="controls">
                        <button onclick="document.getElementById('fileInput').click()">📂 読み込み</button>
                        <input type="file" id="fileInput" class="file-input" accept=".txt,.lrc,.json" onchange="loadFile(event)">
                        <button onclick="saveFile()">💾 保存</button>
                    </div>

                    <div class="export-format">
                        <label>
                            <input type="radio" name="exportFormat" value="lrc" checked> LRC形式
                        </label>
                        <label>
                            <input type="radio" name="exportFormat" value="json"> JSON形式
                        </label>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="panel">
                    <h2>🎤 プレビュー</h2>
                    <div class="preview-container" id="previewContainer">
                        <div class="preview-header">
                            <h3>NOW PLAYING</h3>
                            <div class="now-playing-indicator">
                                <div class="now-playing-dot"></div>
                                <span class="now-playing-text">Lyrics Preview</span>
                            </div>
                        </div>
                        
                        <div class="equalizer" id="equalizer" style="display: none;">
                            <div class="equalizer-bar"></div>
                            <div class="equalizer-bar"></div>
                            <div class="equalizer-bar"></div>
                            <div class="equalizer-bar"></div>
                            <div class="equalizer-bar"></div>
                        </div>
                        
                        <div class="lyrics-stage">
                            <div class="no-lyrics-message" id="noLyricsMessage">
                                <div class="icon">🎵</div>
                                <p>歌詞を入力すると<br>ここにカラオケ風で表示されます</p>
                            </div>
                            <div class="current-lyric-wrapper" id="currentLyricWrapper" style="display: none;">
                                <div class="current-lyric" id="currentLyric"></div>
                                <div class="next-lyric-wrapper" id="nextLyricWrapper" style="display: none;">
                                    <div class="next-lyric-label">NEXT</div>
                                    <div class="next-lyric" id="nextLyric"></div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="progress-container" id="progressContainer" style="display: none;">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="progressBarFill"></div>
                            </div>
                            <div class="progress-time">
                                <span id="progressCurrent">00:00.00</span>
                                <span id="progressTotal">00:00.00</span>
                            </div>
                        </div>
                        
                        <div class="lyrics-list-preview" id="lyricsListPreview" style="display: none;">
                        </div>
                    </div>
                    
                    <div class="preview-controls">
                        <button onclick="playPreview()">▶️ プレビュー再生</button>
                        <button onclick="stopPreview()" class="secondary">⏹️ 停止</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let isRunning = false;
        let lyricsData = [];

        // タイマー表示の更新
        function updateTimeDisplay() {
            const now = Date.now();
            const elapsed = isRunning ? elapsedTime + (now - startTime) : elapsedTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const centiseconds = Math.floor((elapsed % 1000) / 10);
            
            const timeString = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
            document.getElementById('timeDisplay').textContent = timeString;
            
            return timeString;
        }

        // タイマー開始
        function startTimer() {
            if (!isRunning) {
                startTime = Date.now();
                isRunning = true;
                timerInterval = setInterval(updateTimeDisplay, 10);
            }
        }

        // タイマー一時停止
        function pauseTimer() {
            if (isRunning) {
                elapsedTime += Date.now() - startTime;
                isRunning = false;
                clearInterval(timerInterval);
                updateTimeDisplay();
            }
        }

        // タイマーリセット
        function resetTimer() {
            pauseTimer();
            elapsedTime = 0;
            updateTimeDisplay();
        }

        // タイムスタンプを追加
        function addTimestamp() {
            const textarea = document.getElementById('lyricsInput');
            const currentTime = updateTimeDisplay();
            const timestamp = `[${currentTime}]`;
            
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value;
            
            // 改行コードを統一
            const beforeText = text.substring(0, start);
            const afterText = text.substring(end);
            
            // 行頭にタイムスタンプを挿入
            const lastNewline = beforeText.lastIndexOf('\n');
            const insertPos = lastNewline === -1 ? 0 : lastNewline + 1;
            
            textarea.value = text.substring(0, insertPos) + timestamp + ' ' + text.substring(insertPos);
            textarea.selectionStart = textarea.selectionEnd = insertPos + timestamp.length + 1;
            textarea.focus();
            
            parseLyrics();
        }

        // 歌詞を解析して表示
        function parseLyrics() {
            const text = document.getElementById('lyricsInput').value;
            const lines = text.split('\n');
            
            lyricsData = [];
            
            if (text.trim() === '') {
                showNoLyricsMessage();
                return;
            }
            
            lines.forEach((line, index) => {
                const match = line.match(/\[(\d{2}:\d{2}\.\d{2})\](.*)/);
                if (match) {
                    const time = match[1];
                    const lyric = match[2].trim();
                    lyricsData.push({ time, lyric, lineIndex: index });
                } else if (line.trim()) {
                    lyricsData.push({ time: null, lyric: line.trim(), lineIndex: index });
                }
            });
            
            updatePreviewUI();
        }

        // プレビュー UI の更新
        function updatePreviewUI() {
            const noLyricsMsg = document.getElementById('noLyricsMessage');
            const currentLyricWrapper = document.getElementById('currentLyricWrapper');
            const lyricsListPreview = document.getElementById('lyricsListPreview');
            const progressContainer = document.getElementById('progressContainer');
            
            if (lyricsData.length === 0) {
                showNoLyricsMessage();
                return;
            }
            
            // メッセージを隠してプレビューを表示
            noLyricsMsg.style.display = 'none';
            currentLyricWrapper.style.display = 'flex';
            lyricsListPreview.style.display = 'block';
            progressContainer.style.display = 'block';
            
            // 最初の歌詞を表示
            const firstWithTime = lyricsData.find(item => item.time);
            if (firstWithTime) {
                document.getElementById('currentLyric').textContent = firstWithTime.lyric;
            } else {
                document.getElementById('currentLyric').textContent = '曲を開始してください';
            }
            
            // リスト表示を更新
            updateLyricsListPreview();
            
            // 合計時間を計算
            const lastWithTime = [...lyricsData].reverse().find(item => item.time);
            if (lastWithTime) {
                document.getElementById('progressTotal').textContent = lastWithTime.time;
            }
        }

        function showNoLyricsMessage() {
            document.getElementById('noLyricsMessage').style.display = 'block';
            document.getElementById('currentLyricWrapper').style.display = 'none';
            document.getElementById('lyricsListPreview').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'none';
        }

        function updateLyricsListPreview() {
            const container = document.getElementById('lyricsListPreview');
            let html = '';
            
            lyricsData.forEach((item, index) => {
                if (item.time) {
                    html += `<div class="mini-lyric-line" data-index="${index}" onclick="jumpToTime('${item.time}')">
                        <span class="mini-timestamp">${item.time}</span>
                        <span class="mini-lyric-text">${item.lyric}</span>
                    </div>`;
                }
            });
            
            container.innerHTML = html;
        }

        function updateCurrentLyricDisplay(currentIndex) {
            const currentLyricEl = document.getElementById('currentLyric');
            const nextLyricWrapper = document.getElementById('nextLyricWrapper');
            const nextLyricEl = document.getElementById('nextLyric');
            const progressBarFill = document.getElementById('progressBarFill');
            const progressCurrent = document.getElementById('progressCurrent');
            
            // アクティブな行をハイライト
            document.querySelectorAll('.mini-lyric-line').forEach((line, i) => {
                line.classList.toggle('active', i === currentIndex);
            });
            
            // 現在の歌詞を取得
            const currentItem = lyricsData[currentIndex];
            if (currentItem && currentItem.lyric) {
                // アニメーションをリセットして再表示
                currentLyricEl.style.animation = 'none';
                currentLyricEl.offsetHeight; // リフローを強制
                currentLyricEl.style.animation = 'lyricFadeIn 0.5s ease-out';
                currentLyricEl.textContent = currentItem.lyric;
            }
            
            // 次の歌詞を表示
            let nextIndex = currentIndex + 1;
            while (nextIndex < lyricsData.length && !lyricsData[nextIndex].time) {
                nextIndex++;
            }
            
            if (nextIndex < lyricsData.length && lyricsData[nextIndex].time) {
                nextLyricEl.textContent = lyricsData[nextIndex].lyric;
                nextLyricWrapper.style.display = 'block';
            } else {
                nextLyricWrapper.style.display = 'none';
            }
            
            // プログレスバーの更新
            if (currentItem && currentItem.time) {
                progressCurrent.textContent = currentItem.time;
                
                // プログレスバーの幅を計算
                const [minutes, seconds] = currentItem.time.split(':');
                const [secs, centi] = seconds.split('.');
                const currentMs = parseInt(minutes) * 60000 + parseInt(secs) * 1000 + parseInt(centi) * 10;
                
                const lastWithTime = [...lyricsData].reverse().find(item => item.time);
                if (lastWithTime) {
                    const [lastMin, lastSec] = lastWithTime.time.split(':');
                    const [lastS, lastC] = lastSec.split('.');
                    const totalMs = parseInt(lastMin) * 60000 + parseInt(lastS) * 1000 + parseInt(lastC) * 10;
                    
                    const progress = (currentMs / totalMs) * 100;
                    progressBarFill.style.width = `${progress}%`;
                }
            }
        }

        // 指定した時間にジャンプ
        function jumpToTime(time) {
            const [minutes, seconds] = time.split(':');
            const [secs, centi] = seconds.split('.');
            const totalMs = parseInt(minutes) * 60000 + parseInt(secs) * 1000 + parseInt(centi) * 10;
            
            resetTimer();
            elapsedTime = totalMs;
            updateTimeDisplay();
        }

        // プレビュー再生
        let previewTimeouts = [];
        function playPreview() {
            stopPreview();
            
            if (lyricsData.length === 0) {
                alert('歌詞がありません');
                return;
            }
            
            startTimer();
            
            // イコライザーを表示
            document.getElementById('equalizer').style.display = 'flex';
            
            lyricsData.forEach((item, index) => {
                if (item.time) {
                    const [minutes, seconds] = item.time.split(':');
                    const [secs, centi] = seconds.split('.');
                    const timeMs = parseInt(minutes) * 60000 + parseInt(secs) * 1000 + parseInt(centi) * 10;
                    
                    const timeout = setTimeout(() => {
                        updateCurrentLyricDisplay(index);
                    }, timeMs);
                    
                    previewTimeouts.push(timeout);
                }
            });
        }

        function stopPreview() {
            previewTimeouts.forEach(timeout => clearTimeout(timeout));
            previewTimeouts = [];
            pauseTimer();
            
            // イコライザーを非表示
            document.getElementById('equalizer').style.display = 'none';
            
            // ハイライトをクリア
            document.querySelectorAll('.mini-lyric-line').forEach(line => {
                line.classList.remove('active');
            });
        }

        // ファイル保存
        function saveFile() {
            const format = document.querySelector('input[name="exportFormat"]:checked').value;
            let content = '';
            let filename = 'timed_lyrics';
            
            if (format === 'lrc') {
                content = generateLRC();
                filename += '.lrc';
            } else {
                content = JSON.stringify(lyricsData, null, 2);
                filename += '.json';
            }
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        // LRC形式生成
        function generateLRC() {
            const text = document.getElementById('lyricsInput').value;
            const lines = text.split('\n');
            let lrc = '[ti:Untitled]\n[ar:Unknown]\n';
            
            lines.forEach(line => {
                if (line.match(/\[\d{2}:\d{2}\.\d{2}\]/)) {
                    lrc += line + '\n';
                }
            });
            
            return lrc;
        }

        // ファイル読み込み
        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                
                if (file.name.endsWith('.json')) {
                    try {
                        const data = JSON.parse(content);
                        let text = '';
                        data.forEach(item => {
                            if (item.time) {
                                text += `[${item.time}] ${item.lyric}\n`;
                            } else {
                                text += `${item.lyric}\n`;
                            }
                        });
                        document.getElementById('lyricsInput').value = text;
                    } catch (err) {
                        alert('JSONファイルの解析に失敗しました');
                    }
                } else {
                    document.getElementById('lyricsInput').value = content;
                }
                
                parseLyrics();
            };
            reader.readAsText(file);
        }

        // スペースキーでタイムスタンプ追加
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                addTimestamp();
            }
        });

        // 入力変更時に解析
        document.getElementById('lyricsInput').addEventListener('input', parseLyrics);

        // 初期化
        updateTimeDisplay();
    </script>
</body>
</html>
